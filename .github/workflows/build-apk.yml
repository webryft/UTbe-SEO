name: Build APK (shareable)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - name: Prepare Android project
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png www/
          npx cap add android
          npx @capacitor/assets generate --android --assetPath assets
          D=android/app/src/main/java/com/utbeseo/app
          mkdir -p $D && cp android-overlay/*.java $D/
          sed -i 's#<application#<uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Build APK
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: UTbe-SEO-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
