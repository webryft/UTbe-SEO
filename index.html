<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<style>
:root{--r:#f2453d;--bg:#fff;--tx:#222;--mu:#777;--ln:#eee}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,Roboto,sans-serif;color:var(--tx);background:#fff;min-height:100vh;padding-bottom:70px}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:14px 16px;color:#fff;background:linear-gradient(120deg,#ff5a4f,#f2453d,#c2307f,#ff6a5c);background-size:300% 300%;animation:g 14s ease infinite}
@keyframes g{50%{background-position:100% 50%}}
header h1{font-size:19px;flex:1}header b{display:flex;gap:6px;align-items:center;cursor:pointer}
.ib{background:none;border:0;color:inherit;cursor:pointer}
.card{margin:10px;padding:14px;border-radius:14px;background:#fff;box-shadow:0 1px 8px #0002;position:relative}
.btn{border:0;border-radius:8px;padding:12px 16px;background:var(--r);color:#fff;font-weight:700;text-transform:uppercase;cursor:pointer;font-size:14px}
.btn.g{background:#eee;color:#222}.row{display:flex;gap:10px;margin:10px}.row .btn{flex:1}
.x{position:absolute;right:8px;bottom:6px}
.old{text-decoration:line-through;color:#c33}.mu{color:var(--mu)}.c{text-align:center}
.screen{background:#000;border-radius:10px;aspect-ratio:16/9;position:relative;overflow:hidden;display:grid;place-items:center}
.screen img{width:100%;height:100%;object-fit:cover}.screen .pl{position:absolute;width:60px;height:60px;border-radius:50%;background:#0009;color:#fff;border:0;cursor:pointer}
.pl svg{width:32px;height:32px;fill:#fff}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:8px;color:#666;font-size:12px;cursor:pointer}nav button.on{color:var(--r);font-weight:700}
nav svg{display:block;margin:0 auto 2px}
.ov{position:fixed;inset:0;background:#0007;z-index:20;display:grid;place-items:center;animation:f .2s}
@keyframes f{from{opacity:0}}
.md{background:#fff;border-radius:18px;padding:22px;width:min(92%,400px);max-height:85vh;overflow:auto;animation:u .25s}
@keyframes u{from{transform:translateY(24px);opacity:0}}
.md h3{margin-bottom:12px}.md p,.md li{font-size:14px;color:#444;line-height:1.5;margin-bottom:8px}
.opt{display:flex;gap:12px;align-items:center;padding:12px 4px;cursor:pointer;color:#444}
input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font:inherit;margin:6px 0}
.drawer{position:fixed;top:0;bottom:0;left:0;width:78%;max-width:320px;background:#fff;z-index:30;transform:translateX(-105%);transition:.3s;overflow:auto}
.drawer.on{transform:none}.dh{padding:20px 16px;color:#fff;background:linear-gradient(135deg,#0f9d8a,#1aa0a0)}
.dh img{width:56px;height:56px;border-radius:50%;background:#fff;display:block;margin-bottom:8px}
.di{display:flex;gap:18px;padding:14px 18px;cursor:pointer;color:#333}.di svg{color:#666}.sec{padding:12px 18px;color:var(--mu);font-size:13px}
.bar{height:5px;background:#ddd;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--r);width:0;transition:width .5s}
.fab{position:fixed;right:20px;bottom:84px;width:56px;height:56px;border-radius:50%;background:var(--r);color:#fff;border:0;box-shadow:0 4px 12px #0004;cursor:pointer}
.tl{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--ln)}
.sp{width:28px;height:28px;border:4px solid #fcc;border-top-color:var(--r);border-radius:50%;animation:s 1s linear infinite;display:inline-block}@keyframes s{to{transform:rotate(360deg)}}
.big{font-size:38px;font-weight:700;color:#666}.green{color:#2a9d3a;font-size:13px}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:20px;z-index:50;display:none;font-size:14px}
</style></head><body>

<script type="module">

const fb=initializeApp({apiKey:"AIzaSyADFLvww4vFLbYpE5I6AYcKQwQELJLB2pg",authDomain:"unlimitedpower-a6c9e.firebaseapp.com",projectId:"unlimitedpower-a6c9e",storageBucket:"unlimitedpower-a6c9e.firebasestorage.app",messagingSenderId:"229075222841",appId:"1:229075222841:web:1a22d8c1ce0cbecb7f28e8"});
const auth=getAuth(fb),db=getFirestore(fb);
const PK="pk_live_4ff37d15381d1d12c78fd66f7bc86beb64c59415",SITE="https://1234567890.com",MAIL="aladdincharlotte@gmail.com";
const I={menu:'<path d="M3 6h18M3 12h18M3 18h18"/>',bell:'<path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4"/>',coin:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5c0-1 1-1.5 2.5-1.5s2.5.6 2.5 1.7-1 1.5-2.5 1.8-2.5.7-2.5 1.8 1 1.7 2.5 1.7 2.5-.5 2.5-1.5"/>',play:'<path d="M7 4l13 8-13 8z"/>',sub:'<rect x="3" y="8" width="18" height="12" rx="2"/><path d="M6 4h12M9 12l5 3-5 3z"/>',like:'<path d="M7 11v9H3v-9zM7 11l4-8c2 0 3 1 3 3v3h6l-2 9H7"/>',camp:'<path d="M3 11v3l12 5V6zM15 9a3 3 0 010 6M6 14l1 6h3l-1-5"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',cart:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l3 12h10l2-8H6"/>',vip:'<path d="M3 8l4 4 5-8 5 8 4-4-2 11H5z"/>',ads:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z"/>',share:'<circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8 11l8-4M8 13l8 4"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',shield:'<path d="M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z"/>',out:'<path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/>',back:'<path d="M15 5l-7 7 7 7"/>',plus:'<path d="M12 5v14M5 12h14"/>'};

/* pricing */
const rw=s=>Math.max(50,Math.round(50+(s-45)*800/655));
function cost(type,q,s,vip){const f=(q-10)/990,fs=(s-45)/655;const v=q*Math.max(s,60+10*f);
 const lk=q*((20-10*f)+((350-250*f)-(20-10*f))*fs);
 let t=type=='view'?v:type=='sub'?v+lk:(v+lk)/2;return Math.round(vip?t*.9:t)}
const vipOn=()=>S.me&&S.me.vipUntil>Date.now();
const vid=u=>(String(u).match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/)||[])[1];
/* auth */
function login(){const em=localStorage.getItem('em')||'';
 $('#app').innerHTML=`<header><h1>UTbe SEO</h1></header><div class="card" style="margin-top:30px"><h3 class="c" style="margin-bottom:8px">Welcome</h3>
 <input id="n" placeholder="Full name (new account only)"><input id="e" type="email" placeholder="Gmail" value="${em}"><input id="p" type="password" placeholder="Password (min 6)"><input id="rc" placeholder="Referral code (optional)">
 <div class="row" style="margin:8px 0"><button class="btn" id="si">Sign in</button><button class="btn g" id="su">Create account</button></div>
 <button class="btn g" id="go" style="width:100%">Continue with Google</button><p class="mu c" id="er" style="margin-top:10px;color:#c33"></p></div>`;
 const er=m=>$('#er').textContent=m.replace('Firebase: ','');
 $('#si').onclick=()=>{localStorage.setItem('em',$('#e').value);signInWithEmailAndPassword(auth,$('#e').value,$('#p').value).catch(x=>er(x.message))};
 $('#su').onclick=async()=>{localStorage.setItem('em',$('#e').value);window._rc=$('#rc').value.trim().toUpperCase();try{const c=await createUserWithEmailAndPassword(auth,$('#e').value,$('#p').value);await updateProfile(c.user,{displayName:$('#n').value||$('#e').value.split('@')[0]})}catch(x){er(x.message)}};
 $('#go').onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(x=>er(x.message));}
let unsub;
onAuthStateChanged(auth,async u=>{unsub&&unsub();if(!u){S.me=null;return login()}
 const r=doc(db,'users',u.uid);if(!(await getDoc(r)).exists()){const nm=u.displayName||u.email.split('@')[0];
  await setDoc(r,{name:nm,email:u.email,photo:u.photoURL||'',coins:0,ref:u.email.split('@')[0].slice(0,5).toUpperCase(),refUsed:false,banned:false,created:Date.now()});
  if(window._rc)redeem(window._rc,true)}
 unsub=onSnapshot(r,s=>{S.me={id:u.uid,...s.data()};if(S.me.banned){alert('Account suspended.');signOut(auth);return}draw()});
 try{first()}catch(e){}});
function first(){if(!localStorage.getItem('ov')){modal(`<h3>Allow display over other apps</h3><p>For the countdown to stay visible while you watch on YouTube, enable <b>Display over other apps</b> for UTbe SEO in your phone Settings. This needs the Android app version; in the browser, your timer runs while you are away and is checked when you return.</p><button class="btn" style="width:100%" onclick="localStorage.ov=1;close2()">Got it</button>`)}}
/* promo */
function promoEnd(){let e=+localStorage.pe;if(!e||e<Date.now()){e=Date.now()+((24+13)*3600+27*60+23)*1e3;localStorage.pe=e}return e}
function promo(){if(+localStorage.ph>Date.now())return'';return`<div class="card c" data-a="promo"><b class="mu" style="font-size:18px">Special promotion</b><div style="display:flex;justify-content:space-between;margin-top:6px"><span class="mu">150,000 Coins <span class="old">75,000</span></span><b class="mu">₦13,000</b></div><div class="mu" style="font-size:22px;margin-top:6px">End in <span id="cd"></span></div><button class="ib x" data-a="px">${ic('x')}</button></div>`}
setInterval(()=>{const c=$('#cd');if(c){let d=Math.max(0,promoEnd()-Date.now())/1e3|0;c.textContent=`${d/86400|0}:${String(d/3600%24|0).padStart(2,'0')}:${String(d/60%60|0).padStart(2,'0')}:${String(d%60).padStart(2,'0')}`}
 if(+localStorage.ph&&+localStorage.ph<=Date.now()){localStorage.ph=0;draw()}},1000);
/* drawing */
function draw(){if(!S.me)return;const m=S.me;
 const head=S.page?`<header><button class="ib" data-a="home">${ic('back')}</button><h1>${S.page.t}</h1><b data-a="store">${fmt(m.coins)} ${ic('coin')}</b></header>`:
 `<header><button class="ib" data-a="menu">${ic('menu')}</button><h1>UTbe SEO</h1><button class="ib" data-a="bell">${ic('bell')}</button><b data-a="store">${fmt(m.coins)} ${ic('coin')}</b></header>`;
 const body=S.page?S.page.h():tabHTML();
 const nav=S.page?'':`<nav>${[['view','play','View'],['sub','sub','Subscribe'],['like','like','Like'],['camp','camp','Campaign']].map(t=>`<button class="${S.tab==t[0]?'on':''}" data-a="tab" data-v="${t[0]}">${ic(t[1])}${t[2]}</button>`).join('')}</nav>`;
 $('#app').innerHTML=head+body+nav+drawer();}
const drawer=()=>`<div class="drawer" id="dr"><div class="dh"><img src="${S.me.photo||icon}"><b>${S.me.name}</b><div style="font-size:13px">${S.me.email}</div></div>
${[['store','cart','Buy coin'],['vip','vip','VIP account'],['ads','ads','Watch ads video'],['inv','share','Invite friend']].map(x=>`<div class="di" data-a="${x[0]}">${ic(x[1])}${x[2]}</div>`).join('')}<hr style="border:0;border-top:1px solid #eee"><div class="sec">More</div>
${[['about','info','About'],['contact','mail','Contact us'],['priv','shield','Privacy policy'],['out','out','Log out']].map(x=>`<div class="di" data-a="${x[0]}">${ic(x[1])}${x[2]}</div>`).join('')}</div>`;
function tabHTML(){if(S.tab=='camp')return campHTML();const c=S.cur,t=S.tab;
 if(!c)return promo()+`<div class="c" style="margin-top:80px"><div style="font-size:50px;color:#aaa">${ic('play')}</div><h2 class="mu">No video</h2><p class="mu">No video to watch now. Click reload or earn coins.</p><div style="margin-top:12px"><button class="btn" data-a="reload">Reload</button></div><div style="margin-top:10px"><button class="btn" data-a="ads">Watch ads video</button></div></div>`;
 const s=c.sec||45,r=c.reward||(t=='view'?rw(s):t=='sub'?150:100);
 return promo()+`<div class="card"><div class="screen"><img src="https://img.youtube.com/vi/${c.vid}/hqdefault.jpg" alt="">${t=='view'?`<button class="pl" data-a="play">${ic('play')}</button>`:''}</div></div>
 ${t=='view'?`<div class="card"><label style="display:flex;justify-content:flex-end;gap:8px"><span>Auto play</span><input type="checkbox" style="width:auto;margin:0" ${S.auto?'checked':''} data-a="auto"></label><div style="display:flex;text-align:center;margin-top:8px"><div class="big" style="flex:1">${r}<small style="font-size:16px"> coins</small></div><div style="width:2px;background:var(--r)"></div><div class="big" style="flex:1" id="sc">${s}<small style="font-size:16px"> s</small></div></div><div class="bar" style="margin-top:8px"><i id="pb"></i></div></div>`
 :`<div class="card mu">${t=='sub'?'Tap the button to open the video on YouTube. Subscribe and like it, then return here. Use the same Google account in YouTube.':'Tap Like to open the video on YouTube. Like it and return here. Do not unlike any video or your account will be blocked.'}</div>`}
 <div class="row">${t!='view'?`<button class="btn" data-a="play">${t=='sub'?'Subscribe':'Like'}</button>`:''}<button class="btn" data-a="other">See other</button></div>`}
let camps=[];
function campHTML(){return promo()+(camps.length?camps.map(c=>{const p=Math.min(100,Math.round((c.done||0)/c.qty*100));return`<div class="card" data-a="cm" data-v="${c.id}"><div style="display:flex;gap:10px"><img src="https://img.youtube.com/vi/${c.vid}/default.jpg" style="width:90px;border-radius:8px"><div style="flex:1"><b>${c.type.toUpperCase()}</b> · ${c.done||0}/${c.qty}<div class="bar" style="margin:8px 0"><i style="width:${p}%"></i></div><span class="mu" style="font-size:13px">${fmt(c.coins)} coins · ${p}%</span></div></div></div>`}).join(''):`<div class="c mu" style="margin-top:90px"><h2>No campaign</h2><p>Your campaigns appear here. Tap + to create one.</p></div>`)+`<button class="fab" data-a="add">${ic('plus')}</button>`}
async function loadCamps(){const s=await getDocs(query(collection(db,'videos'),where('owner','==',S.me.id)));camps=s.docs.map(d=>({id:d.id,...d.data()}));draw()}
async function reload(){const t=S.tab;if(t=='camp')return loadCamps();const s=await getDocs(query(collection(db,'videos'),where('status','==','active'),limit(60)));
 const seen=L(localStorage['s'+t]||'[]');S.q=s.docs.map(d=>({id:d.id,...d.data()})).filter(v=>v.owner!=S.me.id&&!seen.includes(v.id)&&(t=='view'?['view','watch','sub'].includes(v.type):t=='sub'?v.type=='sub':['like','sub'].includes(v.type)));
 next()}
function next(){S.cur=S.q.shift()||null;draw()}
/* watching */
const wl=t=>{const w=L(localStorage['w'+t]||'{"n":0,"u":0}');return w};
async function credit(c,r){const t=S.tab,seen=L(localStorage['s'+t]||'[]');seen.push(c.id);localStorage['s'+t]=JSON.stringify(seen);
 await updateDoc(doc(db,'users',S.me.id),{coins:increment(r)});await updateDoc(doc(db,'videos',c.id),{done:increment(1)}).catch(()=>{});
 if(t!='view')await addDoc(collection(db,'claims'),{uid:S.me.id,vid:c.id,type:t,t:Date.now()});
 const w=wl(t);w.n++;if(w.n>=30){w.n=0;w.u=Date.now()+6e5}localStorage['w'+t]=JSON.stringify(w);toast(`+${r} coins`)}
function play(){const c=S.cur;if(!c)return;const w=wl(S.tab);if(w.u>Date.now())return toast('Limit reached. Wait '+Math.ceil((w.u-Date.now())/6e4)+' min or switch tab.');
 S.t0=Date.now();S.busy=true;window.open(c.url,'_blank')}
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState!='visible'||!S.busy||!S.cur)return;S.busy=false;
 const c=S.cur,t=S.tab,need=t=='view'?(c.sec||45):45,el=(Date.now()-S.t0)/1e3,r=c.reward||(t=='view'?rw(c.sec||45):t=='sub'?150:100);
 if(t=='view'){if(el>=need){await credit(c,r);setTimeout(()=>{next();if(S.auto)play()},1000)}else toast(`Watch ${Math.ceil(need-el)}s more`)}
 else{modal(`<h3>Checking…</h3><div class="c"><span class="sp"></span><p style="margin-top:12px">Please wait while we check your ${t=='sub'?'subscription':'like'}</p></div>`);

/* payments */
function pay(amount,meta,label){if(!window.PaystackPop)return toast('Payment script not loaded');const ref='UT'+Date.now();
 PaystackPop.setup({key:PK,email:S.me.email,amount:amount*100,currency:'NGN',ref,callback:r=>{addDoc(collection(db,'payments'),{uid:S.me.id,email:S.me.email,name:S.me.name,amount,ref:r.reference,status:'pending',t:Date.now(),...meta});modal(`<h3>Payment received</h3><p>Please hold on. Your ${label} is pending admin confirmation and will appear once approved.</p><button class="btn" style="width:100%" onclick="close2()">OK</button>`)},onClose(){}}).openIframe()}

};
const go=(t,h)=>{S.page={t,h};draw()};
const POL=`<p><b>Information we collect.</b> Your name, email, profile photo, coin balance, campaign data and payment references.</p><p><b>How we use it.</b> To run your account, credit coins, process campaigns, prevent fraud and support you. We do not sell your data.</p><p><b>Payments.</b> Handled by Paystack; we never see your card details.</p><p><b>Third parties.</b> Firebase (storage and sign-in), Paystack (payments), Google AdSense (ads, which may use cookies).</p><p><b>Your rights.</b> Email ${MAIL} to access or delete your data.</p><p><b>Changes.</b> Updates will be posted in the app.</p>`;
const ABOUT=`<p>© 2026 UTbe SEO</p><p>YouTube has lifted countless people out of poverty, and we are here to help your video rank higher. UTbe SEO is a community of creators: watch other creators' videos, earn coins, then spend them to promote your own.</p><p>It is free to start. Real people like you watch, like and subscribe, helping you work toward YouTube's watch-hour requirements.</p><p>Join thousands of creators growing together. Earn, promote, repeat.</p>`;
const MSG=`UTbe SEO is a platform where you can make your video rank top 10 in the YouTube algorithm. Other users watch your video and you watch theirs, earning coins to keep promoting your own videos. YouTube has changed people's financial lives and over 40,000,000 users are ready to watch your video. Click the link to join: ${SITE}`;
async function redeem(code,quiet){const m=S.me||{};code=code.toUpperCase();if(!quiet&&m.refUsed)return toast('Already redeemed');
 const s=await getDocs(query(collection(db,'users'),where('ref','==',code),limit(1)));if(s.empty)return quiet||toast('Invalid code');const o=s.docs[0];
 if(o.id==auth.currentUser.uid)return quiet||toast('You cannot use your own code');

const VIP=[['Monthly',1500,1],['3 months',3500,3],['6 months',7000,6],['1 year',10000,12]];
/* campaign creation */
const SECS=[45,60,90,120,150,180,210,240,300,360,420,480,540,600,650,700];
function chooser(){modal(`<h3>Choose a goal for your campaign</h3>${[['sub','sub','Subscribers, likes and views for your channel'],['view','play','Views for your video'],['like','like','Likes for your video'],['prem','camp','Premium campaign for VIP']].map(x=>`<div class="opt" data-a="goal" data-v="${x[0]}">${ic(x[1])}<span>${x[2]}</span></div>`).join('')}<div style="text-align:right"><button class="ib" style="color:var(--r);font-weight:700" onclick="close2()">CANCEL</button></div>`)}
function linkAsk(type){modal(`<h3>Enter video link</h3><div style="display:flex;gap:8px"><input id="lk" placeholder="https://youtu.be/…"><button class="btn" id="ad">Add</button></div><p class="mu" style="font-size:13px">How to get your link: open your video on YouTube, tap Share, then Copy link.</p>`);
 $('#ad').onclick=()=>{const u=$('#lk').value.trim(),v=vid(u);if(!v)return toast('Invalid YouTube link');close();type=='prem'?premPage(u,v):settings(type,u,v)}}
const WARN=`<div class="mu" style="font-size:13px;padding:12px"><b>Warning ⚠️</b><br>• Do not create too many campaigns for one video; YouTube will not count many views from one IP in a short time.<br>• Video length must be at least 45 seconds.<br>• YouTube needs 72 hours to update views from third-party apps. Use YouTube Studio to check in real time.</div>`;
function settings(type,u,v){let q=50,s=60;const q2=[10,...Array.from({length:19},(_,i)=>(i+1)*50+0)].filter((x,i,a)=>x>=10&&x<=1000).map(x=>x);
 const qs=[10,50,100,150,200,250,300,350,400,450,500,550,600,650,700,750,800,850,900,950,1000];
 const lab=type=='sub'?'Expected subscribers':type=='like'?'Expected likes':'Expected views';
 go('Create campaign',()=>`<div style="background:#000;text-align:center"><img src="https://img.youtube.com/vi/${v}/hqdefault.jpg" style="max-width:100%;max-height:220px"></div>
 <div class="card"><b>Premium campaign</b><p class="mu" style="font-size:14px">Priority processing · faster & more effective delivery</p><p style="color:var(--r);font-size:14px">Recommended for creators who want quicker results</p><button class="btn g" data-a="prempg" data-u="${u}" data-v="${v}">Create premium campaign</button></div>
 <div style="padding:0 16px"><h3 class="mu" style="border-bottom:1px solid #aaa;padding-bottom:4px">CAMPAIGN SETTINGS</h3>
 <div class="tl" style="border:0"><span>${lab}</span><select id="q" style="width:110px">${qs.map(x=>`<option ${x==q?'selected':''}>${x}</option>`).join('')}</select></div>
 ${type=='sub'?'<div class="mu" style="font-size:13px">Likes match subscribers automatically.</div>':''}
 <div class="tl" style="border:0"><span>Time required (sec)</span><input id="s" type="number" min="45" value="${s}" style="width:110px"></div>
 <div class="tl"><span>VIP account (reduce 10%)</span>${vipOn()?'<b style="color:#2a9d3a">Active</b>':'<button class="btn g" data-a="vip">Upgrade</button>'}</div>
 <div class="tl" style="border:0"><span>Total coin</span><b id="tc" style="background:#eee;padding:10px 20px;border-radius:6px">0</b></div>
 <button class="btn g" id="dn" style="width:100%">Done</button></div>${WARN}`);
 const up=()=>{q=+$('#q').value;s=+$('#s').value||45;$('#tc').textContent=fmt(cost(type,q,s,vipOn()))};
 $('#q').onchange=up;$('#s').oninput=up;up();
 $('#dn').onclick=async()=>{s=Math.max(45,+$('#s').value||45);if(s>700)return modal(`<h3>Over 700 seconds</h3><p>Longer watch times are available in the Premium campaign.</p><button class="btn" style="width:100%" onclick="close2()">OK</button>`);
  const c=cost(type,q,s,vipOn());if(S.me.coins<c)return modal(`<h3>Not enough coins</h3><p>You need ${fmt(c)} coins. Buy more to continue.</p><button class="btn" style="width:100%" data-a="store">Buy coin</button>`);
  await updateDoc(doc(db,'users',S.me.id),{coins:increment(-c)});await addDoc(collection(db,'videos'),{owner:S.me.id,url:u,vid:v,type,qty:q,sec:s,coins:c,done:0,status:'active',t:Date.now()});toast('Campaign created');S.page=null;S.tab='camp';loadCamps()}}
function premPage(u,v){let tg='view';const T={view:50,like:50,sub:150,comment:300,watch:0};const LEN=[['shorter than 15 minutes',300],['between 15 and 30 minutes',600],['between 30 and 60 minutes',1200],['longer than 60 minutes',2400]];
 go('Premium campaign',()=>`<div style="background:#000;text-align:center"><img src="https://img.youtube.com/vi/${v}/hqdefault.jpg" style="max-height:220px;max-width:100%"></div><div style="padding:16px"><h3 class="mu">CAMPAIGN SETTINGS</h3>
 <div class="tl" style="border:0"><span>Target</span><select id="tg" style="width:150px"><option value="view">View</option><option value="like">Like</option><option value="watch">Watch time</option><option value="comment">Comment</option><option value="sub">Subscribers</option></select></div>
 <div class="tl" style="border:0"><span>Quantity</span><input id="pq" type="number" min="1" value="100" style="width:120px"></div>
 <div id="ex"></div><div class="tl" style="border:0;color:var(--r)"><span>TOTAL COIN</span><b id="tc">0</b></div><button class="btn g" id="dn" style="width:100%">Done</button></div>${WARN}`);
 const up=()=>{tg=$('#tg').value;const q=+$('#pq').value||0;let t=0;
  $('#ex').innerHTML=tg=='watch'?`<b style="font-size:14px">Confirm your exact video length. Incorrect info may cancel your campaign.</b>${LEN.map((l,i)=>`<label class="opt"><input type="radio" name="ln" value="${i}" style="width:auto;margin:0"> My video is ${l[0]}</label>`).join('')}`:tg=='comment'?`<textarea id="cm" rows="4" placeholder="One comment per line (300 coins each)"></textarea>`:'';
  if(tg=='watch'){const r=document.querySelector('[name=ln]:checked');t=r?q*LEN[r.value][1]:0}else if(tg=='comment'){t=($('#cm')?.value.split('\n').filter(x=>x.trim()).length||0)*300}else t=q*T[tg];$('#tc').textContent=fmt(t);return t};
 $('#tg').onchange=()=>{up()};$('#pq').oninput=up;document.addEventListener('input',up,{once:false});
 $('#dn').onclick=async()=>{const t=up();if(!t)return toast('Complete the settings');if(S.me.coins<t)return toast('Not enough coins');
  const d={owner:S.me.id,url:u,vid:v,type:tg=='watch'?'watch':tg=='comment'?'comment':tg,qty:+$('#pq').value,coins:t,done:0,premium:true,status:tg=='comment'?'review':'active',sec:tg=='watch'?600:60,t:Date.now()};
  if(tg=='comment')d.comments=$('#cm').value.split('\n').filter(x=>x.trim());await updateDoc(doc(db,'users',S.me.id),{coins:increment(-t)});await addDoc(collection(db,'videos'),d);toast(tg=='comment'?'Sent to admin':'Campaign created');S.page=null;S.tab='camp';loadCamps()}}
/* events */
document.addEventListener('click',async e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,v=el.dataset.v;
 const dr=$('#dr');if(a!='menu'&&dr)dr.classList.remove('on');
 switch(a){
 case'menu':dr.classList.add('on');setTimeout(()=>document.addEventListener('click',()=>$('#dr')?.classList.remove('on'),{once:true}),0);break;
 case'bell':modal(`<h3>Broadcast</h3><p>No new announcements.</p><button class="btn" style="width:100%" onclick="close2()">Close</button>`);break;
 case'tab':S.tab=v;S.page=null;S.cur=null;reload();draw();break;
 case'home':S.page=null;S.tab='view';reload();break;
 case'store':close();S.page=pages.store();draw();break;
 case'buy':{const p=v.split(',');pay(+p[1],{kind:'coins',coins:+p[0]},fmt(p[0])+' coins');break}
 case'promo':pay(13000,{kind:'coins',coins:150000},'150,000 coins');break;
 case'px':e.stopPropagation();localStorage.ph=Date.now()+40*6e4;draw();break;
 case'vip':close();go('VIP account',()=>`<div class="card"><b>Why VIP?</b><p class="mu" style="font-size:14px">• Promote your videos 10% cheaper (save 60,000 on a 600,000-coin campaign)<br>• No ads<br>• Priority support</p></div>${VIP.map((x,i)=>`<div class="card tl" style="border:0" data-a="vipb" data-v="${i}"><b>${x[0]}</b><b style="color:var(--r)">₦${fmt(x[1])}</b></div>`).join('')}`);break;
 case'vipb':{const x=VIP[v];pay(x[1],{kind:'vip',months:x[2]},'VIP '+x[0]);break}
 case'ads':close();modal(`<h3>Watch ads video</h3><p>Watch the ad to earn <b>200 coins</b>.</p><div class="c" style="margin:10px 0"><ins class="adsbygoogle" style="display:block;min-height:100px" data-ad-client="ca-pub-3899764771871192" data-ad-slot="5050002840" data-ad-format="auto"></ins></div><div class="c mu" id="at">Watch for 15s…</div>`);
  try{(adsbygoogle=window.adsbygoogle||[]).push({})}catch(_){}let n=15;const iv=setInterval(()=>{if(!$('#at'))return clearInterval(iv);n--;if(n<=0){clearInterval(iv);updateDoc(doc(db,'users',S.me.id),{coins:increment(200)});$('#at').innerHTML='<b style="color:#2a9d3a">+200 coins</b>'}else $('#at').textContent=`Watch for ${n}s…`},1000);break;
 case'inv':go('Invite friend',()=>`<div class="card"><p class="mu">Your referral code</p><div class="big" style="color:var(--r)">${S.me.ref}</div><p class="mu" style="font-size:13px">You earn 500 coins when a friend redeems it.</p><button class="btn" data-a="share">Share</button></div><div class="card"><b>Redeem a code</b><input id="rd" placeholder="Friend's code"><button class="btn" data-a="redeem">Redeem</button></div>`);break;
 case'share':{const t=MSG+'\nReferral code: '+S.me.ref;navigator.share?navigator.share({title:'UTbe SEO',text:t,url:SITE}).catch(()=>{}):(navigator.clipboard.writeText(t),toast('Copied to clipboard'));break}
 case'redeem':redeem($('#rd').value.trim());break;
 case'about':go('About',()=>`<div class="card">${ABOUT}</div>`);break;
 case'priv':go('Privacy policy',()=>`<div class="card">${POL}</div>`);break;
 case'contact':location.href=`mailto:${MAIL}?subject=UTbe SEO support`;break;
 case'out':signOut(auth);break;
 case'play':play();break;case'other':next();break;case'reload':reload();break;
 case'auto':S.auto=el.checked;break;
 case'add':chooser();break;
 case'goal':close();linkAsk(v);break;
 case'prempg':premPage(el.dataset.u,v);break;
 case'cm':{const c=camps.find(x=>x.id==v),p=Math.min(100,Math.round((c.done||0)/c.qty*100));modal(`<h3>${c.type.toUpperCase()} campaign</h3><p>Progress ${p}% (${c.done||0}/${c.qty})</p><div class="row" style="margin:0"><button class="btn g" data-a="del" data-v="${v}">Delete</button><button class="btn" onclick="close2()">${p>=100?'Keep':'Close'}</button></div><button class="btn" style="width:100%;margin-top:10px" data-a="again" data-v="${v}">Run again on same video</button>`);break}
 case'del':close();await deleteDoc(doc(db,'videos',v));loadCamps();break;
 case'again':{close();const c=camps.find(x=>x.id==v);c.premium?premPage(c.url,c.vid):settings(c.type,c.url,c.vid);break}}});
